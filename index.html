```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Pressão Arterial</title>

<style>

body {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  max-width: 700px;
  margin: auto;
  padding: 20px;
  background: #f5f5f5;
  color: #333;
}

h2 {
  text-align: center;
}

.card {
  background: white;
  padding: 15px;
  margin: 15px 0;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

input,
textarea,
select {
  width: 100%;
  padding: 10px;
  margin: 5px 0 12px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 5px;
}

button {
  padding: 9px 12px;
  cursor: pointer;
  margin: 3px;
  border: none;
  border-radius: 5px;
  background: #1976d2;
  color: white;
}

button:hover {
  opacity: 0.85;
}

.btn-excluir {
  background: #d32f2f;
}

.btn-editar {
  background: #f57c00;
}

.btn-cancelar {
  background: #777;
}

.medicao {
  background: white;
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}

.pressao {
  font-size: 24px;
  font-weight: bold;
}

.normal {
  border-left: 6px solid #2e7d32;
}

.alerta {
  border-left: 6px solid #f9a825;
}

.alta {
  border-left: 6px solid #d32f2f;
}

.baixa {
  border-left: 6px solid #1565c0;
}

.classificacao {
  font-weight: bold;
  margin-top: 5px;
}

.total {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  margin: 20px 0;
}

.media {
  background: #e3f2fd;
  padding: 15px;
  border-radius: 8px;
  margin-top: 15px;
}

#lista {
  margin-top: 10px;
}

.observacao {
  color: #666;
  font-style: italic;
}

.vazio {
  text-align: center;
  color: #777;
  padding: 20px;
}

</style>
</head>

<body>

<h2>❤️ Controle de Pressão Arterial</h2>

<!-- FORMULÁRIO -->

<div class="card">

<h3 id="tituloFormulario">Nova medição</h3>

<label>Data</label>
<input type="date" id="dataInput">

<label>Hora</label>
<input type="time" id="horaInput">

<label>Pressão sistólica</label>
<input
  type="number"
  id="sistolicaInput"
  placeholder="Ex.: 120"
  min="50"
  max="250"
>

<label>Pressão diastólica</label>
<input
  type="number"
  id="diastolicaInput"
  placeholder="Ex.: 80"
  min="30"
  max="150"
>

<label>Frequência cardíaca (BPM)</label>
<input
  type="number"
  id="bpmInput"
  placeholder="Ex.: 70"
  min="30"
  max="220"
>

<label>Observação</label>

<textarea
  id="observacaoInput"
  placeholder="Ex.: Em repouso, após caminhada, antes do medicamento..."
></textarea>

<button onclick="salvarMedicao()" id="btnSalvar">
  💾 Salvar medição
</button>

<button
  onclick="cancelarEdicao()"
  class="btn-cancelar"
  id="btnCancelar"
  style="display:none;"
>
  Cancelar
</button>

</div>


<!-- RESUMO -->

<div class="card">

<h3>📊 Resumo</h3>

<div id="resumo">
Carregando...
</div>

</div>


<!-- LISTA -->

<h3>📋 Histórico de medições</h3>

<div id="lista">
Carregando...
</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>


<script>

// =====================================================
// CONFIGURAÇÃO FIREBASE
// =====================================================

const firebaseConfig = {

  apiKey: "AIzaSyCy7my7mba4Ii47drcrhJEXmcByRRzN90",

  authDomain: "lista-colaborativa-7790b.firebaseapp.com",

  databaseURL:
    "https://lista-colaborativa-7790b-default-rtdb.firebaseio.com",

  projectId: "lista-colaborativa-7790b",

  storageBucket:
    "lista-colaborativa-7790b.firebasestorage.app",

  messagingSenderId: "830696828500",

  appId:
    "1:830696828500:web:2971388ec7ed99c10f87c1"

};


// Inicializa Firebase

firebase.initializeApp(firebaseConfig);


// Banco de dados

const ref =
  firebase.database().ref("pressao");


// ID utilizado quando estiver editando

let idEdicao = null;


// =====================================================
// DATA E HORA ATUAL
// =====================================================

function preencherDataHora() {

  const agora = new Date();

  const ano = agora.getFullYear();

  const mes =
    String(agora.getMonth() + 1).padStart(2, "0");

  const dia =
    String(agora.getDate()).padStart(2, "0");

  const hora =
    String(agora.getHours()).padStart(2, "0");

  const minuto =
    String(agora.getMinutes()).padStart(2, "0");


  document.getElementById("dataInput").value =
    `${ano}-${mes}-${dia}`;

  document.getElementById("horaInput").value =
    `${hora}:${minuto}`;
}


preencherDataHora();


// =====================================================
// CLASSIFICAÇÃO
// =====================================================

function classificarPressao(sistolica, diastolica) {

  if (sistolica < 90 || diastolica < 60) {

    return {
      texto: "Pressão baixa",
      classe: "baixa"
    };

  }


  if (sistolica >= 140 || diastolica >= 90) {

    return {
      texto: "Pressão alta",
      classe: "alta"
    };

  }


  if (
    sistolica >= 130 ||
    diastolica >= 85
  ) {

    return {
      texto: "Atenção",
      classe: "alerta"
    };

  }


  return {
    texto: "Dentro da faixa esperada",
    classe: "normal"
  };

}


// =====================================================
// SALVAR MEDIÇÃO
// =====================================================

function salvarMedicao() {

  const data =
    document.getElementById("dataInput").value;

  const hora =
    document.getElementById("horaInput").value;

  const sistolica =
    parseInt(
      document.getElementById("sistolicaInput").value
    );

  const diastolica =
    parseInt(
      document.getElementById("diastolicaInput").value
    );

  const bpm =
    parseInt(
      document.getElementById("bpmInput").value
    ) || 0;

  const observacao =
    document.getElementById("observacaoInput").value.trim();


  // Validação

  if (!data) {

    alert("Informe a data.");

    return;

  }


  if (!hora) {

    alert("Informe o horário.");

    return;

  }


  if (!sistolica || !diastolica) {

    alert("Informe a pressão sistólica e diastólica.");

    return;

  }


  if (
    sistolica < 50 ||
    sistolica > 250 ||
    diastolica < 30 ||
    diastolica > 150
  ) {

    alert("Verifique os valores da pressão.");

    return;

  }


  const classificacao =
    classificarPressao(
      sistolica,
      diastolica
    );


  const medicao = {

    data: data,

    hora: hora,

    sistolica: sistolica,

    diastolica: diastolica,

    bpm: bpm,

    observacao: observacao,

    classificacao: classificacao.texto,

    criadoEm: new Date().toISOString()

  };


  // ===================================================
  // EDITAR
  // ===================================================

  if (idEdicao) {

    ref
      .child(idEdicao)
      .update(medicao)
      .then(() => {

        alert("Medição alterada com sucesso.");

        cancelarEdicao();

      });

    return;

  }


  // ===================================================
  // NOVA MEDIÇÃO
  // ===================================================

  ref
    .push(medicao)
    .then(() => {

      alert("Medição salva com sucesso.");

      limparFormulario();

    });

}


// =====================================================
// LIMPAR FORMULÁRIO
// =====================================================

function limparFormulario() {

  document.getElementById("sistolicaInput").value = "";

  document.getElementById("diastolicaInput").value = "";

  document.getElementById("bpmInput").value = "";

  document.getElementById("observacaoInput").value = "";

  preencherDataHora();

}


// =====================================================
// EDITAR MEDIÇÃO
// =====================================================

function editarMedicao(id, item) {

  idEdicao = id;


  document.getElementById("tituloFormulario").innerText =
    "✏️ Editar medição";


  document.getElementById("dataInput").value =
    item.data || "";


  document.getElementById("horaInput").value =
    item.hora || "";


  document.getElementById("sistolicaInput").value =
    item.sistolica || "";


  document.getElementById("diastolicaInput").value =
    item.diastolica || "";


  document.getElementById("bpmInput").value =
    item.bpm || "";


  document.getElementById("observacaoInput").value =
    item.observacao || "";


  document.getElementById("btnSalvar").innerText =
    "💾 Salvar alteração";


  document.getElementById("btnCancelar").style.display =
    "inline-block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


// =====================================================
// CANCELAR EDIÇÃO
// =====================================================

function cancelarEdicao() {

  idEdicao = null;


  document.getElementById("tituloFormulario").innerText =
    "Nova medição";


  document.getElementById("btnSalvar").innerText =
    "💾 Salvar medição";


  document.getElementById("btnCancelar").style.display =
    "none";


  limparFormulario();

}


// =====================================================
// EXCLUIR
// =====================================================

function excluirMedicao(id) {

  if (
    !confirm(
      "Tem certeza que deseja excluir esta medição?"
    )
  ) {

    return;

  }


  ref
    .child(id)
    .remove();

}


// =====================================================
// RENDERIZAR LISTA
// =====================================================

ref.on("value", snap => {

  const data = snap.val() || {};

  const lista =
    document.getElementById("lista");


  lista.innerHTML = "";


  const registros =
    Object.entries(data);


  // Ordenar por data e hora

  registros.sort((a, b) => {

    const dataA =
      `${a[1].data} ${a[1].hora}`;

    const dataB =
      `${b[1].data} ${b[1].hora}`;

    return dataB.localeCompare(dataA);

  });


  if (registros.length === 0) {

    lista.innerHTML =
      '<div class="vazio">Nenhuma medição registrada.</div>';

    atualizarResumo([]);

    return;

  }


  registros.forEach(([id, item]) => {

    const sistolica =
      parseInt(item.sistolica) || 0;

    const diastolica =
      parseInt(item.diastolica) || 0;

    const bpm =
      parseInt(item.bpm) || 0;


    const classificacao =
      classificarPressao(
        sistolica,
        diastolica
      );


    const div =
      document.createElement("div");


    div.className =
      "medicao " + classificacao.classe;


    div.innerHTML = `

      <div>

        📅 <strong>${formatarData(item.data)}</strong>

        às <strong>${item.hora || "--:--"}</strong>

      </div>

      <br>

      <div class="pressao">

        ❤️ ${sistolica}/${diastolica} mmHg

      </div>

      <div>

        💓 Frequência cardíaca:
        ${bpm > 0 ? bpm + " BPM" : "Não informado"}

      </div>

      <div class="classificacao">

        ${classificacao.texto}

      </div>

      ${
        item.observacao
        ?
        `<p class="observacao">
          📝 ${item.observacao}
        </p>`
        :
        ""
      }

      <br>

      <button
        class="btn-editar"
        onclick='editarMedicao(
          "${id}",
          ${JSON.stringify(item).replace(/'/g, "\\'")}
        )'
      >
        ✏️ Editar
      </button>

      <button
        class="btn-excluir"
        onclick="excluirMedicao('${id}')"
      >
        🗑️ Excluir
      </button>

    `;


    lista.appendChild(div);

  });


  atualizarResumo(
    registros.map(item => item[1])
  );

});


// =====================================================
// RESUMO
// =====================================================

function atualizarResumo(registros) {

  const resumo =
    document.getElementById("resumo");


  if (!registros.length) {

    resumo.innerHTML =
      "Nenhuma medição disponível.";

    return;

  }


  let totalSistolica = 0;

  let totalDiastolica = 0;

  let totalBpm = 0;

  let quantidadeBpm = 0;

  let altas = 0;

  let baixas = 0;


  registros.forEach(item => {

    const sistolica =
      parseInt(item.sistolica) || 0;

    const diastolica =
      parseInt(item.diastolica) || 0;

    const bpm =
      parseInt(item.bpm) || 0;


    totalSistolica += sistolica;

    totalDiastolica += diastolica;


    if (bpm > 0) {

      totalBpm += bpm;

      quantidadeBpm++;

    }


    if (
      sistolica >= 140 ||
      diastolica >= 90
    ) {

      altas++;

    }


    if (
      sistolica < 90 ||
      diastolica < 60
    ) {

      baixas++;

    }

  });


  const mediaSistolica =
    (
      totalSistolica /
      registros.length
    ).toFixed(1);


  const mediaDiastolica =
    (
      totalDiastolica /
      registros.length
    ).toFixed(1);


  const mediaBpm =
    quantidadeBpm
    ?
    (
      totalBpm /
      quantidadeBpm
    ).toFixed(1)
    :
    "Não informado";


  resumo.innerHTML = `

    <div class="media">

      📊 <strong>Total de medições:</strong>
      ${registros.length}

      <br><br>

      ❤️ <strong>Média da pressão:</strong>
      ${mediaSistolica}/${mediaDiastolica} mmHg

      <br><br>

      💓 <strong>Média dos batimentos:</strong>
      ${mediaBpm}
      ${mediaBpm !== "Não informado" ? " BPM" : ""}

      <br><br>

      🔴 <strong>Medições altas:</strong>
      ${altas}

      <br>

      🔵 <strong>Medições baixas:</strong>
      ${baixas}

    </div>

  `;

}


// =====================================================
// FORMATAR DATA
// =====================================================

function formatarData(data) {

  if (!data) return "";

  const partes =
    data.split("-");


  if (partes.length !== 3) {

    return data;

  }


  return `${partes[2]}/${partes[1]}/${partes[0]}`;

}

</script>

</body>
</html>
