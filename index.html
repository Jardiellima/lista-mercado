<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"

<title>Controle de Pressão Arterial</title>


<style>

body {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;

</head>


<body>


<h2>❤️ Controle de Pressão Arterial</h2>


<!-- ================================================= -->
<!-- FORMULÁRIO -->
<!-- ================================================= -->

<div class="card">

<h3 id="tituloFormulario">
  Nova medição

  type="number"

></textarea>

>

>

</button>

<!-- ================================================= -->
<!-- RESUMO -->

<div class="card">

<h3>📊 Resumo</h3>

<div id="resumo">

  class="btn-pdf"
  onclick="gerarPDF()"
>
  📄 Salvar resultados em PDF
</button>

</div>


<!-- ================================================= -->
<!-- HISTÓRICO -->
<!-- ================================================= -->

<h3>📋 Histórico de medições</h3>

<div id="lista">
  Carregando...
</div>


<!-- ================================================= -->
<!-- FIREBASE -->
<!-- ================================================= -->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>


<!-- ================================================= -->
<!-- jsPDF -->
<!-- ================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>


<script>


// =====================================================
// FIREBASE
// =====================================================

const firebaseConfig = {

  apiKey:
    "AIzaSyCy7my7mba4Ii47drcrhJEXmcByRRzN90",

  authDomain:
    "lista-colaborativa-7790b.firebaseapp.com",

  databaseURL:
    "https://lista-colaborativa-7790b-default-rtdb.firebaseio.com",

  projectId:
    "lista-colaborativa-7790b",

  storageBucket:
    "lista-colaborativa-7790b.firebasestorage.app",

  messagingSenderId:
    "830696828500",

  appId:
    "1:830696828500:web:2971388ec7ed99c10f87c1"

};


firebase.initializeApp(firebaseConfig);


const ref =
  firebase.database().ref("pressao");


let idEdicao = null;


// Guarda os registros atuais para o PDF

let registrosAtuais = [];


// =====================================================
// DATA E HORA
// =====================================================

function preencherDataHora() {

  const agora = new Date();

  const ano =
    agora.getFullYear();

  const mes =
    String(agora.getMonth() + 1)
    .padStart(2, "0");

  const dia =
    String(agora.getDate())
    .padStart(2, "0");

  const hora =
    String(agora.getHours())
    .padStart(2, "0");

  const minuto =
    String(agora.getMinutes())
    .padStart(2, "0");


  document.getElementById("dataInput").value =
    `${ano}-${mes}-${dia}`;

  document.getElementById("horaInput").value =
    `${hora}:${minuto}`;

}


preencherDataHora();


// =====================================================
// CLASSIFICAÇÃO
// =====================================================

function classificarPressao(
  sistolica,
  diastolica
) {

  if (
    sistolica < 90 ||
    diastolica < 60
  ) {

    return {
      texto: "Pressão baixa",
      classe: "baixa"
    };

  }


  if (
    sistolica >= 140 ||
    diastolica >= 90
  ) {

    return {
      texto: "Pressão alta",
      classe: "alta"
    };

  }


  if (
    sistolica >= 130 ||
    diastolica >= 85
  ) {

    return {
      texto: "Atenção",
      classe: "alerta"
    };

  }


  return {
    texto: "Dentro da faixa esperada",
    classe: "normal"
  };

}


// =====================================================
// SALVAR
// =====================================================

function salvarMedicao() {

  const data =
    document.getElementById("dataInput").value;

  const hora =
    document.getElementById("horaInput").value;

  const sistolica =
    parseInt(
      document.getElementById("sistolicaInput").value
    );

  const diastolica =
    parseInt(
      document.getElementById("diastolicaInput").value
    );

  const bpm =
    parseInt(
      document.getElementById("bpmInput").value
    ) || 0;

  const observacao =
    document
      .getElementById("observacaoInput")
      .value
      .trim();


  if (!data) {

    alert("Informe a data.");

    return;

  }


  if (!hora) {

    alert("Informe o horário.");

    return;

  }


  if (!sistolica || !diastolica) {

    alert(
      "Informe a pressão sistólica e diastólica."
    );

    return;

  }


  if (
    sistolica < 50 ||
    sistolica > 250 ||
    diastolica < 30 ||
    diastolica > 150
  ) {

    alert(
      "Verifique os valores da pressão."
    );

    return;

  }


  const classificacao =
    classificarPressao(
      sistolica,
      diastolica
    );


  const medicao = {

    data: data,

    hora: hora,

    sistolica: sistolica,

    diastolica: diastolica,

    bpm: bpm,

    observacao: observacao,

    classificacao:
      classificacao.texto,

    criadoEm:
      new Date().toISOString()

  };


  // EDITAR

  if (idEdicao) {

    ref
      .child(idEdicao)
      .update(medicao)
      .then(() => {

        alert(
          "Medição alterada com sucesso."
        );

        cancelarEdicao();

      });

    return;

  }


  // NOVA MEDIÇÃO

  ref
    .push(medicao)
    .then(() => {

      alert(
        "Medição salva com sucesso."
      );

      limparFormulario();

    });

}


// =====================================================
// LIMPAR
// =====================================================

function limparFormulario() {

  document.getElementById(
    "sistolicaInput"
  ).value = "";

  document.getElementById(
    "diastolicaInput"
  ).value = "";

  document.getElementById(
    "bpmInput"
  ).value = "";

  document.getElementById(
    "observacaoInput"
  ).value = "";


  preencherDataHora();

}


// =====================================================
// EDITAR
// =====================================================

function editarMedicao(
  id,
  item
) {

  idEdicao = id;


  document.getElementById(
    "tituloFormulario"
  ).innerText =
    "✏️ Editar medição";


  document.getElementById(
    "dataInput"
  ).value =
    item.data || "";


  document.getElementById(
    "horaInput"
  ).value =
    item.hora || "";


  document.getElementById(
    "sistolicaInput"
  ).value =
    item.sistolica || "";


  document.getElementById(
    "diastolicaInput"
  ).value =
    item.diastolica || "";


  document.getElementById(
    "bpmInput"
  ).value =
    item.bpm || "";


  document.getElementById(
    "observacaoInput"
  ).value =
    item.observacao || "";


  document.getElementById(
    "btnSalvar"
  ).innerText =
    "💾 Salvar alteração";


  document.getElementById(
    "btnCancelar"
  ).style.display =
    "inline-block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


// =====================================================
// CANCELAR EDIÇÃO
// =====================================================

function cancelarEdicao() {

  idEdicao = null;


  document.getElementById(
    "tituloFormulario"
  ).innerText =
    "Nova medição";


  document.getElementById(
    "btnSalvar"
  ).innerText =
    "💾 Salvar medição";


  document.getElementById(
    "btnCancelar"
  ).style.display =
    "none";


  limparFormulario();

}


// =====================================================
// EXCLUIR
// =====================================================

function excluirMedicao(id) {

  if (
    !confirm(
      "Tem certeza que deseja excluir esta medição?"
    )
  ) {

    return;

  }


  ref
    .child(id)
    .remove();

}


// =====================================================
// LISTA DO FIREBASE
// =====================================================

ref.on("value", snap => {

  const data =
    snap.val() || {};


  const lista =
    document.getElementById("lista");


  lista.innerHTML = "";


  const registros =
    Object.entries(data);


  registros.sort(
    (a, b) => {

      const dataA =
        `${a[1].data} ${a[1].hora}`;

      const dataB =
        `${b[1].data} ${b[1].hora}`;

      return dataB.localeCompare(dataA);

    }
  );


  // Guarda para geração do PDF

  registrosAtuais =
    registros.map(
      item => item[1]
    );


  if (
    registros.length === 0
  ) {

    lista.innerHTML =
      '<div class="vazio">Nenhuma medição registrada.</div>';

    atualizarResumo([]);

    return;

  }


  registros.forEach(
    ([id, item]) => {

      const sistolica =
        parseInt(item.sistolica) || 0;

      const diastolica =
        parseInt(item.diastolica) || 0;

      const bpm =
        parseInt(item.bpm) || 0;


      const classificacao =
        classificarPressao(
          sistolica,
          diastolica
        );


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "medicao " +
        classificacao.classe;


      div.innerHTML = `

        <div>

          📅 <strong>
            ${formatarData(item.data)}
          </strong>

          às <strong>
            ${item.hora || "--:--"}
          </strong>

        </div>

        <div class="pressao">

          ❤️ ${sistolica}/${diastolica} mmHg

        </div>

        <div>

          💓 Frequência cardíaca:

          ${
            bpm > 0
            ? bpm + " BPM"
            : "Não informado"
          }

        </div>

        <div class="classificacao">

          ${classificacao.texto}

        </div>

        ${
          item.observacao
          ?
          `<p class="observacao">
            📝 ${escapeHTML(item.observacao)}
          </p>`
          :
          ""
        }

        <br>

        <button
          class="btn-editar"
          onclick="editarMedicao('${id}', ${JSON.stringify(item).replace(/'/g, "\\'")})"
        >
          ✏️ Editar
        </button>

        <button
          class="btn-excluir"
          onclick="excluirMedicao('${id}')"
        >
          🗑️ Excluir
        </button>

      `;


      lista.appendChild(div);

    }
  );


  atualizarResumo(
    registros.map(
      item => item[1]
    )
  );

});


// =====================================================
// RESUMO
// =====================================================

function atualizarResumo(
  registros
) {

  const resumo =
    document.getElementById(
      "resumo"
    );


  if (
    !registros.length
  ) {

    resumo.innerHTML =
      "Nenhuma medição disponível.";

    return;

  }


  let totalSistolica = 0;

  let totalDiastolica = 0;

  let totalBpm = 0;

  let quantidadeBpm = 0;

  let altas = 0;

  let baixas = 0;


  registros.forEach(
    item => {

      const sistolica =
        parseInt(
          item.sistolica
        ) || 0;

      const diastolica =
        parseInt(
          item.diastolica
        ) || 0;

      const bpm =
        parseInt(
          item.bpm
        ) || 0;


      totalSistolica +=
        sistolica;

      totalDiastolica +=
        diastolica;


      if (bpm > 0) {

        totalBpm += bpm;

        quantidadeBpm++;

      }


      if (
        sistolica >= 140 ||
        diastolica >= 90
      ) {

        altas++;

      }


      if (
        sistolica < 90 ||
        diastolica < 60
      ) {

        baixas++;

      }

    }
  );


  const mediaSistolica =
    (
      totalSistolica /
      registros.length
    ).toFixed(1);


  const mediaDiastolica =
    (
      totalDiastolica /
      registros.length
    ).toFixed(1);


  const mediaBpm =
    quantidadeBpm
    ?
    (
      totalBpm /
      quantidadeBpm
    ).toFixed(1)
    :
    "Não informado";


  resumo.innerHTML = `

    <div class="media">

      📊 <strong>
        Total de medições:
      </strong>

      ${registros.length}

      <br><br>

      ❤️ <strong>
        Média da pressão:
      </strong>

      ${mediaSistolica}/${mediaDiastolica}
      mmHg

      <br><br>

      💓 <strong>
        Média dos batimentos:
      </strong>

      ${mediaBpm}

      ${
        mediaBpm !== "Não informado"
        ? " BPM"
        : ""
      }

      <br><br>

      🔴 <strong>
        Medições altas:
      </strong>

      ${altas}

      <br>

      🔵 <strong>
        Medições baixas:
      </strong>

      ${baixas}

    </div>

  `;

}


// =====================================================
// GERAR PDF
// =====================================================

function gerarPDF() {

  if (
    !registrosAtuais.length
  ) {

    alert(
      "Não existem medições para gerar o PDF."
    );

    return;

  }


  const {
    jsPDF
  } = window.jspdf;


  const doc =
    new jsPDF(
      "p",
      "mm",
      "a4"
    );


  // ---------------------------------------------------
  // TÍTULO
  // ---------------------------------------------------

  doc.setFontSize(18);

  doc.setFont(
    "helvetica",
    "bold"
  );


  doc.text(
    "Controle de Pressão Arterial",
    14,
    18
  );


  doc.setFontSize(10);

  doc.setFont(
    "helvetica",
    "normal"
  );


  const agora =
    new Date();


  doc.text(
    "Relatório gerado em: " +
    agora.toLocaleString("pt-BR"),
    14,
    25
  );


  // ---------------------------------------------------
  // CÁLCULOS
  // ---------------------------------------------------

  let totalSistolica = 0;

  let totalDiastolica = 0;

  let totalBpm = 0;

  let quantidadeBpm = 0;

  let altas = 0;

  let baixas = 0;


  registrosAtuais.forEach(
    item => {

      const sistolica =
        parseInt(
          item.sistolica
        ) || 0;

      const diastolica =
        parseInt(
          item.diastolica
        ) || 0;

      const bpm =
        parseInt(
          item.bpm
        ) || 0;


      totalSistolica +=
        sistolica;

      totalDiastolica +=
        diastolica;


      if (
        bpm > 0
      ) {

        totalBpm += bpm;

        quantidadeBpm++;

      }


      if (
        sistolica >= 140 ||
        diastolica >= 90
      ) {

        altas++;

      }


      if (
        sistolica < 90 ||
        diastolica < 60
      ) {

        baixas++;

      }

    }
  );


  const mediaSistolica =
    (
      totalSistolica /
      registrosAtuais.length
    ).toFixed(1);


  const mediaDiastolica =
    (
      totalDiastolica /
      registrosAtuais.length
    ).toFixed(1);


  const mediaBpm =
    quantidadeBpm
    ?
    (
      totalBpm /
      quantidadeBpm
    ).toFixed(1)
    :
    "-";


  // ---------------------------------------------------
  // RESUMO NO PDF
  // ---------------------------------------------------

  doc.setFontSize(12);

  doc.setFont(
    "helvetica",
    "bold"
  );


  doc.text(
    "Resumo",
    14,
    37
  );


  doc.setFontSize(10);

  doc.setFont(
    "helvetica",
    "normal"
  );


  doc.text(
    "Total de medições: " +
    registrosAtuais.length,
    14,
    44
  );


  doc.text(
    "Média da pressão: " +
    mediaSistolica +
    "/" +
    mediaDiastolica +
    " mmHg",
    14,
    50
  );


  doc.text(
    "Média dos batimentos: " +
    mediaBpm +
    " BPM",
    14,
    56
  );


  doc.text(
    "Medições classificadas como altas: " +
    altas,
    14,
    62
  );


  doc.text(
    "Medições classificadas como baixas: " +
    baixas,
    14,
    68
  );


  // ---------------------------------------------------
  // TABELA
  // ---------------------------------------------------

  const tabela =
    registrosAtuais.map(
      item => {

        const classificacao =
          classificarPressao(
            parseInt(
              item.sistolica
            ) || 0,
            parseInt(
              item.diastolica
            ) || 0
          );


        return [

          formatarData(
            item.data
          ),

          item.hora ||
          "--:--",

          (
            item.sistolica ||
            "-"
          ) +
          "/" +
          (
            item.diastolica ||
            "-"
          ),

          item.bpm
            ? item.bpm
            : "-",

          classificacao.texto,

          item.observacao
            ? item.observacao
            : "-"

        ];

      }
    );


  doc.autoTable({

    startY: 75,

    head: [[

      "Data",
      "Hora",
      "Pressão",
      "BPM",
      "Classificação",
      "Observação"

    ]],

    body: tabela,

    theme: "grid",

    styles: {

      fontSize: 8,

      cellPadding: 2,

      overflow: "linebreak"

    },

    headStyles: {

      fontStyle: "bold"

    },

    columnStyles: {

      0: {
        cellWidth: 22
      },

      1: {
        cellWidth: 15
      },

      2: {
        cellWidth: 23
      },

      3: {
        cellWidth: 15
      },

      4: {
        cellWidth: 35
      },

      5: {
        cellWidth: 70
      }

    }

  });


  // ---------------------------------------------------
  // RODAPÉ
  // ---------------------------------------------------

  const paginas =
    doc.internal.getNumberOfPages();


  for (
    let i = 1;
    i <= paginas;
    i++
  ) {

    doc.setPage(i);

    const altura =
      doc.internal.pageSize.height;


    doc.setFontSize(8);

    doc.setFont(
      "helvetica",
      "normal"
    );


    doc.text(
      "Controle de Pressão Arterial - Página " +
      i +
      " de " +
      paginas,
      14,
      altura - 10
    );

  }


  // ---------------------------------------------------
  // SALVAR
  // ---------------------------------------------------

  const dataArquivo =
    agora
      .toISOString()
      .slice(0, 10);


  doc.save(
    "controle-pressao-" +
    dataArquivo +
    ".pdf"
  );

}


// =====================================================
// FORMATAR DATA
// =====================================================

function formatarData(
  data
) {

  if (!data) {
    return "";
  }


  const partes =
    data.split("-");


  if (
    partes.length !== 3
  ) {

    return data;

  }


  return (
    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]
  );

}


// =====================================================
// SEGURANÇA PARA OBSERVAÇÕES
// =====================================================

function escapeHTML(
  texto
) {

  return texto
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
